syntax = "proto3";

package artemis_mudri.simulation.v1;

import "artemis_mudri/protos/simulation/v1/common.proto";
import "artemis_mudri/protos/simulation/v1/event.proto";
import "artemis_mudri/protos/simulation/v1/observation.proto";

// 自动行驶小车仿真的双向流式服务。
service VehicleSimulationService {
  // 运行一次仿真 episode。
  //
  // 客户端首条消息必须是 StartEpisodeRequest；episode 运行期间，客户端持续发送
  // VehicleControlCommand 推进仿真，也可以发送 StopEpisodeRequest 主动结束。
  // 服务端会先返回 EpisodeStarted，再返回若干 ObservationFrame，最终返回
  // EpisodeFinished 或错误说明。
  rpc StreamEpisode(stream ClientMessage) returns (stream ServerMessage);
}

// 客户端发往仿真服务的流式消息。
message ClientMessage {
  oneof payload {
    // 启动 episode 的请求，必须作为流中的第一条消息发送。
    StartEpisodeRequest start = 1;
    // 环境动作：后双驱目标速度命令，用于推进一段控制周期。
    VehicleControlCommand control_command = 2;
    // 主动停止当前 episode 的请求。
    StopEpisodeRequest stop = 3;
  }
}

// 启动一次仿真 episode 的参数。
message StartEpisodeRequest {
  // 本次 episode 的最大仿真时长，单位秒；0 表示使用服务端默认时间上限。
  double max_time_s = 1;
  // 控制周期，单位秒；0 表示使用仿真后端默认步长。
  double control_period_s = 2;
  // 手动指定车辆初始位姿；不设置时使用路线默认起点。
  Pose2D initial_pose = 3;
  // 手动指定 oracle 路径进度搜索的初始采样点索引；不设置时从路线起点开始。
  uint32 initial_progress_index = 4;
  // 可选随机种子；不设置或为 0 时由服务端采用默认随机策略。
  uint64 random_seed = 5;
  // 训练侧所需的事件与真值遥测输出配置；不设置时服务端使用默认输出策略。
  TrainingTraceConfig training_trace = 6;
}

// 车辆控制命令。
message VehicleControlCommand {
  // 客户端侧命令序号，用于排查丢包、乱序或日志对齐。
  uint64 sequence_id = 1;
  // 后左电机目标速度，单位为编码器脉冲/20ms。
  double rear_left_target_speed = 2;
  // 后右电机目标速度，单位为编码器脉冲/20ms。
  double rear_right_target_speed = 3;
}

// 客户端主动停止 episode 的请求。
message StopEpisodeRequest {
  // 停止原因；为空时服务端使用默认原因。
  string reason = 1;
}

// 服务端发回客户端的流式消息。
message ServerMessage {
  oneof payload {
    // episode 已启动并返回运行参数。
    EpisodeStarted started = 1;
    // 仿真观测帧。
    ObservationFrame observation = 2;
    // episode 已结束并返回汇总结果。
    EpisodeFinished finished = 3;
    // episode 执行失败或请求不合法。
    string error = 4;
  }
}

// episode 启动后的运行参数。
message EpisodeStarted {
  // 服务端默认时间上限，单位秒。
  double time_limit_s = 1;
  // 本次 episode 实际采用的控制周期，单位秒。
  double control_period_s = 2;
}

// episode 结束消息。
message EpisodeFinished {
  // 本次 episode 的汇总统计。
  SimulationSummary summary = 1;
  // 结束原因，例如 goal_reached、time_limit、client_stopped 或 viewer_closed。
  string reason = 2;
  // 结束时对应的 step 事实记录，便于训练客户端对齐终止/截断语义。
  StepTrace final_step_trace = 3;
}

// episode 汇总统计。
message SimulationSummary {
  // 是否到达路径终点。
  bool reached_goal = 1;
  // 实际经过的仿真时间，单位秒。
  double elapsed_time_s = 2;
  // 路径总长度，单位米。
  double route_length_m = 3;
  // 最大横向路径误差，单位米。
  double max_cross_track_error_m = 4;
  // 横向路径误差均方根，单位米。
  double rms_cross_track_error_m = 5;
  // episode 结束时的车体位姿。
  Pose2D final_pose = 6;
  // episode 中记录到的路径事件。
  repeated SimulationEvent events = 7;
  // episode 总 step 数。
  uint64 total_steps = 8;
}
