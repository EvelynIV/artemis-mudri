syntax = "proto3";

package artemis_mudri.simulation.v1;

import "artemis_mudri/protos/simulation/v1/common.proto";

// 半结构化事件的严重程度。
enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_FAILURE = 3;
}

// 仿真过程中记录的半结构化事件。
//
// 事件采用“稳定外壳 + 半结构化 payload”设计：服务端保证基础字段稳定，具体事件
// 含义由 namespace/type/name 与 metrics/labels 共同表达，避免在 proto 中提前定死
// 所有训练实验可能需要的事件类型。
message SimulationEvent {
  // 事件名称；保留为主标识，兼容原有路径 checkpoint 事件。
  string name = 1;
  // 事件发生时的仿真时间，单位秒。
  double timestamp_s = 2;
  // 事件对应的路径采样点或路径段索引。
  uint32 path_index = 3;
  // episode 内事件序号，按产生顺序递增。
  uint64 event_id = 4;
  // 事件对应的 step 序号。
  uint64 step_id = 5;
  // 事件命名空间，例如 path、sensor、safety、vehicle、episode。
  string namespace = 6;
  // 事件类型，例如 checkpoint、state_changed、threshold_crossed、terminated。
  string type = 7;
  // 事件严重程度，便于客户端过滤或统计。
  EventSeverity severity = 8;
  // 事件发生时的车体位姿。
  Pose2D pose = 9;
  // 数值型事件 payload，例如 cross_track_error_m、progress_m、duration_s。
  map<string, double> metrics = 10;
  // 字符串型事件 payload，例如 segment、source、reason。
  map<string, string> labels = 11;
}
