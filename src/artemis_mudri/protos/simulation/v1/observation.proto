syntax = "proto3";

package artemis_mudri.simulation.v1;

import "artemis_mudri/protos/simulation/v1/common.proto";
import "artemis_mudri/protos/simulation/v1/event.proto";

// 单帧仿真观测数据。
message ObservationFrame {
  // 服务端观测序号，随仿真步进递增。
  uint64 sequence_id = 1;
  // 当前仿真时间，单位秒。
  double sim_time_s = 2;
  // 巡线传感器黑度观测，顺序按传感器阵列从左到右排列。
  repeated double line_sensor_darkness = 3;
  // IMU 航向观测。
  ImuFrame imu = 4;
  // 当前路径完成进度。
  PathProgressFrame path_progress = 5;
  // 车体运动学观测。
  KinematicsFrame kinematics = 6;
  // 奖励函数可用的真值信息，不应作为策略观测直接输入。
  OracleFrame oracle = 7;
  // 当前 step 的训练事实记录。服务端只提供事实与事件，不在此处计算 reward。
  StepTrace step_trace = 8;
  // 车体真值位姿，供调试和可视化使用；不应作为训练策略观测直接输入。
  Pose2D pose = 9;
}

// IMU 航向观测。
message ImuFrame {
  // 车体偏航角，单位度，范围 [0, 360)。
  double yaw_deg = 1;
  // 车体偏航角速度，单位度/秒。
  double yaw_rate_deg_s = 2;
}

// 车体运动学观测，使用标准物理单位。
message KinematicsFrame {
  // 车体前进方向速度，单位 m/s。
  double longitudinal_velocity_m_s = 1;
  // 车体侧向速度，单位 m/s。
  double lateral_velocity_m_s = 2;
  // 车体偏航角速度，单位 rad/s。
  double yaw_rate_rad_s = 3;
}

// 奖励函数可用的真值信息。
message OracleFrame {
  // 车体到参考路径最近点的有符号横向误差，单位米。正值表示在路径前进方向左侧，负值表示右侧。
  double cross_track_error_m = 1;
  // 车体方向与参考路径切线方向的夹角误差，单位弧度，范围 [-pi, pi]。
  double heading_error_rad = 2;
  // 当前最近路径采样点索引。
  uint32 progress_index = 3;
  // 已沿参考路径推进的距离，单位米。
  double progress_m = 4;
  // 距离参考路径终点的剩余距离，单位米。
  double remaining_distance_m = 5;
}

// 路径与事件完成进度。
message PathProgressFrame {
  // 当前所在路径段索引。
  uint32 active_segment_index = 1;
  // 已完成事件数量。
  uint32 completed_event_count = 2;
  // 已完成事件名称列表。
  repeated string completed_events = 3;
  // 是否已到达路径终点。
  bool reached_goal = 4;
  // 当前最近路径采样点索引。
  uint32 progress_index = 5;
  // 已沿参考路径推进的距离，单位米。
  double progress_m = 6;
  // 相比上一帧推进的路径距离，单位米；可用于客户端 reward shaping。
  double delta_progress_m = 7;
  // 距离参考路径终点的剩余距离，单位米。
  double remaining_distance_m = 8;
}

// 训练侧事件与真值遥测输出配置。
//
// 该配置只决定服务端返回哪些可复现事实，不定义 reward。reward 应由训练客户端
// 基于 ObservationFrame、OracleFrame、StepTrace 和 SimulationEvent 自行计算。
message TrainingTraceConfig {
  // 是否在每帧返回 oracle 真值遥测。
  bool include_oracle = 1;
  // 是否在每帧返回本 step 新触发的事件。
  bool include_step_events = 2;
  // 是否在 episode 结束汇总中返回完整事件日志。
  bool include_episode_events = 3;
  // 客户端用于标记 reward/训练实验配置的名称，服务端仅透传到日志或诊断信息。
  string reward_profile = 4;
}

// 单个环境 step 的事实记录。
//
// 该结构对应 Gymnasium step 返回值中的 done/info 事实部分，但不包含 reward。
message StepTrace {
  // 服务端 step 序号，随仿真推进递增。
  uint64 step_id = 1;
  // 触发本 step 的客户端动作序号；初始观测没有对应动作时为 0。
  uint64 action_sequence_id = 2;
  // 本 step 的仿真时长，单位秒。
  double dt_s = 3;
  // 当前 episode 是否因为任务成功或失败自然终止。
  bool terminated = 4;
  // 当前 episode 是否因为时间上限、客户端停止或外部原因被截断。
  bool truncated = 5;
  // 终止或截断原因；未结束时为空。
  string reason = 6;
  // 本 step 新触发的半结构化事件。
  repeated SimulationEvent events = 7;
}
